root /var/www/chezakvest/current;
index index.html;

access_log /var/log/nginx/chezakvest.access.log;
error_log /var/log/nginx/chezakvest.error.log;

server_tokens off;
sendfile on;
tcp_nopush on;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/xml
    image/svg+xml;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Robots-Tag $chezakvest_robots_header always;
add_header Strict-Transport-Security $chezakvest_hsts_header always;

include /etc/nginx/snippets/chezakvest-legacy-redirects.conf;

location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    try_files $uri =404;
}

location ^~ /_astro/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Robots-Tag $chezakvest_robots_header always;
    add_header Strict-Transport-Security $chezakvest_hsts_header always;
}

location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp)$ {
    try_files $uri =404;
    expires 30d;
}

location ~* \.mp4$ {
    try_files $uri =404;
    expires 30d;
    mp4;
}

location = /404.html {
    try_files /404.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Robots-Tag $chezakvest_robots_header always;
    add_header Strict-Transport-Security $chezakvest_hsts_header always;
}

location / {
    try_files $uri $uri/ $uri/index.html =404;
    expires -1;
}

error_page 404 /404.html;
