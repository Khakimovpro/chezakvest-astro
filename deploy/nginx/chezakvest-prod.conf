# Template rendered by deploy/enable-domain.sh. Do not install it without rendering.
# The domain list is owned by that script; placeholders keep it out of this file.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAMES__;

    access_log /var/log/nginx/chezakvest.access.log;
    error_log /var/log/nginx/chezakvest.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://__CANONICAL_HOST__$request_uri;
    }
}

server {
    listen 443 ssl__HTTP2_LISTEN_SUFFIX__;
    listen [::]:443 ssl__HTTP2_LISTEN_SUFFIX__;
    __HTTP2_DIRECTIVE__
    server_name __CANONICAL_HOST__;

    ssl_certificate /etc/letsencrypt/live/__CERTIFICATE_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERTIFICATE_NAME__/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/__CERTIFICATE_NAME__/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    # Let's Encrypt stopped publishing OCSP URLs in 2025; nginx may report these as ignored.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    set $chezakvest_robots_header "__ROBOTS_HEADER__";

    # HSTS is rendered only after an HTTPS request, certificate-chain check and expiry check pass.
    set $chezakvest_hsts_header "__HSTS_HEADER__";

    include /etc/nginx/snippets/chezakvest-common.conf;
}

server {
    listen 443 ssl__HTTP2_LISTEN_SUFFIX__ default_server;
    listen [::]:443 ssl__HTTP2_LISTEN_SUFFIX__ default_server;
    __HTTP2_DIRECTIVE__
    server_name _ __ALTERNATIVE_NAMES__;

    ssl_certificate /etc/letsencrypt/live/__CERTIFICATE_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERTIFICATE_NAME__/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/__CERTIFICATE_NAME__/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    # Let's Encrypt stopped publishing OCSP URLs in 2025; nginx may report these as ignored.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    return 301 https://__CANONICAL_HOST__$request_uri;
}
