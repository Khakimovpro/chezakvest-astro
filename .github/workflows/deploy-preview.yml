name: Deploy public preview

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit SHA, branch, or tag to publish
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: public-preview
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish public preview
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out requested source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Record source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Python verification dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Run release gate
        run: npm run ci

      - name: Build and verify public preview artifact
        run: npm run verify:github-pages

      - name: Check out preview publication repository
        uses: actions/checkout@v7
        with:
          repository: Khakimovpro/chezakvest-preview
          ref: main
          ssh-key: ${{ secrets.PREVIEW_DEPLOY_KEY }}
          path: preview-publication

      - name: Publish the verified artifact
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          rsync -a --delete --exclude .git dist/ preview-publication/
          touch preview-publication/.nojekyll
          printf '%s\n' "$SOURCE_SHA" > preview-publication/.preview-release
          git -C preview-publication config user.name "github-actions[bot]"
          git -C preview-publication config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C preview-publication add -A
          if git -C preview-publication diff --cached --quiet; then
            echo "Preview already contains artifact for this revision."
          else
            git -C preview-publication commit -m "Preview ${SOURCE_SHA}"
            git -C preview-publication push origin HEAD:main
          fi

      - name: Verify GitHub Pages publication
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          for attempt in $(seq 1 40); do
            if test "$(curl --fail --silent --show-error "https://khakimovpro.github.io/chezakvest-preview/.preview-release?revision=${SOURCE_SHA}")" = "$SOURCE_SHA"; then
              echo "GitHub Pages serves ${SOURCE_SHA}."
              exit 0
            fi
            sleep 15
          done
          echo "GitHub Pages did not serve ${SOURCE_SHA} within ten minutes." >&2
          exit 1
