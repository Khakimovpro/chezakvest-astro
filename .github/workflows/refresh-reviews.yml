name: Refresh reviews

# Отзывы на сайте лежат файлом, а на оригинале их каждый раз тянет сторонний
# виджет. Раз в неделю забираем свежие из того же API и, если что-то изменилось,
# коммитим и публикуем превью заново.

on:
  schedule:
    # Понедельник, 05:00 UTC — 08:00 по Москве.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-reviews
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch reviews and publish when they change
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Fetch fresh reviews
        run: node scripts/update-reviews.mjs

      - name: Check what changed
        id: diff
        run: |
          if git diff --quiet -- src/data/reviews.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Свежих отзывов нет."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/data/reviews.json
          fi

      # Данные попадают в сборку, поэтому битый файл не должен уехать в репозиторий.
      - name: Verify the site still builds
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run test
          npm run build

      - name: Commit fresh reviews
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/reviews.json
          git commit -m "Обновить отзывы из MyReviews"
          git push

      - name: Publish public preview
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-preview.yml \
            --repo "${{ github.repository }}" \
            --ref master \
            -f source_ref="$(git rev-parse HEAD)"
